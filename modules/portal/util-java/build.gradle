cleanJar {
	doLast {
		project.delete(rootProject.file("../${project.name}/${project.name}.jar"))
	}
}

dependencies {
	compileOnly group: "com.liferay", name: "com.ibm.icu4j", version: "54.1.1.LIFERAY-PATCHED-2"
	compileOnly group: "com.liferay", name: "javax.xml.rpc", version: "1.1"
	compileOnly group: "com.liferay", name: "org.apache.axis", version: "1.4.LIFERAY-PATCHED-6"
	compileOnly group: "javax.portlet", name: "portlet-api", version: "3.0.1"
	compileOnly group: "javax.servlet", name: "javax.servlet-api", version: "3.1.0"
	compileOnly group: "net.fortuna.ical4j", name: "ical4j", version: "1.0-rc3"
	compileOnly group: "org.apache.ant", name: "ant", transitive: false, version: "1.9.15"
	compileOnly group: "org.apache.axis", name: "axis-ant", version: "1.4"
	compileOnly group: "org.apache.poi", name: "poi", version: "4.1.2"
	compileOnly group: "org.aspectj", name: "aspectjrt", version: "1.9.5"
	compileOnly group: "org.aspectj", name: "aspectjweaver", version: "1.9.5"
	compileOnly group: "org.dom4j", name: "dom4j", version: "2.1.3"
	compileOnly project(":portal:portal-kernel")
}

jar {
	doLast {
		copy {
			from jar.archivePath
			into rootProject.file("../${project.name}")
			rename { "${project.name}.jar" }
		}
	}
}


sourceSets {
	main {
		java {
			srcDirs rootProject.file("../${project.name}/src")
		}
		resources {
			srcDirs rootProject.file("../${project.name}/src")
		}
	}
}