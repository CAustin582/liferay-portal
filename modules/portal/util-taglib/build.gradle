dependencies {
	compileOnly group: "com.liferay.alloy-taglibs", name: "alloy-taglib", version: "1.1.14"
	compileOnly group: "javax.portlet", name: "portlet-api", version: "3.0.1"
	compileOnly group: "javax.servlet", name: "javax.servlet-api", version: "3.1.0"
	compileOnly group: "javax.servlet.jsp", name: "jsp-api", version: "2.1"
	compileOnly group: "org.osgi", name: "org.osgi.annotation.versioning", version: "1.1.0"
	compileOnly project(":apps:petra:petra-encryptor")
	compileOnly project(":portal:portal-kernel")
	compileOnly project(":portal:util-java")
}

deploy {
	doLast {
		if (liferay.appServerType == "tomcat") {
			project.copy {
				from project.file("classes/META-INF")
				include "*.tld"
				into new File(liferay.appServerPortalDir, "/WEB-INF/tld")
			}
		}
	}
}

