apply from: file('../../build-common.gradle')

classes {
	doLast {
		ant.replace(
			file: "classes/META-INF/liferay-portlet_1_0.tld",
			token: "<short-name>portlet_1_0</short-name>",
			value: "<short-name>portlet</short-name>"
		)

		ant.replace(
			file: "classes/META-INF/liferay-portlet_2_0.tld",
			token: "<short-name>portlet_2_0</short-name>",
			value: "<short-name>portlet</short-name>"
		)

		ant.replaceregexp(
			file: "classes/META-INF/liferay-ui.tld",
			flags: "gs" ,
			match: "&lt;tag-extension.*&lt;/tag-extension>",
			replace: ""
		)

		for (File file : project.fileTree('classes/META-INF').include('*.tld')) {
			println(file.name)
		}


