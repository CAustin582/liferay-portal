cleanJar {
	doLast {
		project.delete(rootProject.file('../util-bridges/util-bridges.jar'))
	}
}

dependencies {
	compileOnly group: "javax.portlet", name: "portlet-api", version: "3.0.1"
	compileOnly group: "javax.servlet", name: "javax.servlet-api", version: "3.1.0"
	compileOnly project(":portal:portal-kernel")
}
jar {
	doLast {
		copy {
			from jar.archivePath
			into rootProject.file('../util-bridges')
			rename { 'util-bridgesS.jar' }
		}
	}
}

sourceSets {
	main {
		java {
			srcDirs rootProject.file('../util-bridges/src')
		}
		resources {
			srcDirs rootProject.file('../util-bridges/src')
		}
	}
}